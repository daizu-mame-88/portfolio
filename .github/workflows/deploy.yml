name: Deploy to GitHub Pages

# mainブランチにプッシュがあったときにこのアクションを実行
on:
  push:
    branches:
      - main
  schedule:
    # Run everyday at 0:00 UTC (9:00 JST)
    - cron: '0 0 * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. リポジトリのチェックアウト (変更なし)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      
      # 2. Node.js環境のセットアップ (変更なし)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      # 3. 依存関係のインストール (変更なし)
      - name: Install dependencies
        run: npm install

      # 3.5. アプリ情報の更新 (追加)
      - name: Update apps.json
        run: npm run update-apps
        env:
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
          APP_STORE_VENDOR_NUMBER: ${{ secrets.APP_STORE_VENDOR_NUMBER }}

      # 4. Astroのビルド (変更なし)
      - name: Build Astro site
        run: npm run build
        
      # 🌟 4.5. GitHub Pages 成果物の設定 (追加) 🌟
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 🌟 4.6. ビルド成果物のアップロード (追加) 🌟
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3 # Pages専用のアップロードアクションを使用
        with:
          path: dist # Astroのビルド成果物が出力されるディレクトリ

      # 5. GitHub Pagesへのデプロイ (変更なし)
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 
        # artifacts の指定は不要になりました。deploy-pagesが自動で 'github-pages' を探します。
        # with: の中身も不要です。